; Phantom S980: 3840 x 2160, dual 40G QSFP+ CoaXPress-over-Fiber.
; Confirm the bank and stripe values against the S980 eGrabber XML supplied
; with the camera. NbGrabbers=2 uses both QSFP+ interfaces.

; Host buffering and physical links
NbBuffers = 32
BufferPartCount = 32
NbGrabbers = 2

; Sensor format
FullHeight = 2160
Width = 3840
PixelFormat = Mono8

; The S980 uses the same software-trigger path as the other Phantom
; CoaXPress profiles. TriggerMode is left at the camera/SDK default until
; the exact S980 GenICam enum is confirmed.
TriggerSource = SWTRIGGER
TriggerSelector = ExposureStart

; Acquisition controls
GainSelector = DigitalAll
Gain = 1.00
BalanceWhiteMarker = Off
; Below the camera's reported 988.705 us maximum at 1000 fps.
ExposureTime = 988
; Frame-grabber trigger period in microseconds: 1000 us = 1000 fps.
; Required for SWTRIGGER; omitting it makes the driver write an invalid 0.
CycleMinimumPeriod = 1000
AcquisitionFrameRate = 1000

; Two QSFP+ links are represented by two input offsets. These values are
; provisional and must match the bank geometry reported by eGrabber.
Offset0 = 0
Offset1 = 4

; Stream layout defaults used by the S980 grabber setup. Keep these in the
; file so they can be tuned without recompiling once the camera XML is known.
StripeHeight = 4
BlockHeight = 0
StripeArrangement = Geometry_1X_1Y
