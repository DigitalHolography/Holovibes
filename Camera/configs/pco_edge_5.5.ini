[pco_edge]
; All times in SECONDS (s) PCO.edge 5.5 USB
exposure_time = 0.001  ; 1ms (within 500µs-2s range for RS mode)
frame_period  = 0.033  ; ~30fps default (1/30)
roi_x = 0
roi_y = 0
; max. roi_width/height 2560x2160
; ROI constraints: width multiple of 4 (min 64), height min 16
roi_width = 2560
roi_height = 2160
; trigger_mode: 0=FreeRun(auto) 1=Software 2=External
trigger_mode = 0
; pixel_rate: 0=auto/default (172 or 320 MPixel/s depending on shutter mode)
pixel_rate = 0
; pixel_format = Mono16 or Mono8 (recommended Mono16 for 16-bit AD)
pixel_format = Mono16